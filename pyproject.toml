[project]
name = "nox-buybot"
version = "1.0.0"
description = "Telegram buy tracker for a Uniswap V2 pair"
readme = "README.md"
requires-python = ">=3.9"
license = { file = "LICENSE" }
authors = [{ name = "eKisNonos", email = "ekisanon@proton.me" }]
keywords = ["telegram", "ethereum", "uniswap", "bot", "nox"]
dependencies = [
    "aiohttp>=3.9",
    "websockets>=12",
    "Pillow>=10",
]

[project.urls]
Homepage = "https://github.com/NON-OS/BuyBot"
Issues = "https://github.com/NON-OS/BuyBot/issues"

[project.scripts]
nox-buybot = "buybot.app:cli"

[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["buybot*"]

[tool.ruff]
line-length = 120
target-version = "py39"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "B", "C4", "SIM"]
ignore = ["E501", "B008", "SIM105"]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["E402"]
